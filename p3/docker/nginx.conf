# Single browser-facing origin. Upstreams are fixed here; nothing is client-selectable.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
  listen 8088;
  server_tokens off;
  client_max_body_size 64k;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' ws: wss:; img-src 'self' data:; frame-ancestors 'none'" always;

  location /api/ { proxy_pass http://gateway:4000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /svc/ { proxy_pass http://gateway:4000; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /sso/ { proxy_pass http://sso-gateway:4200; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; }
  # User-side prover (P2 client or the diagnostic stand-in). Never routed through the gateway.
  location /p2/ { proxy_pass http://wallet-prover:4700/; proxy_read_timeout 120s; }
  location / { try_files $uri /index.html; }
}
