name: Set up circom
description: >
  Install the pinned circom compiler from the official iden3 repository with cargo, cached by
  version. circuits/test/setup.js refuses any version other than 2.2.3.
inputs:
  version:
    description: circom release tag without the leading v
    default: "2.2.3"
runs:
  using: composite
  steps:
    - name: Cache circom ${{ inputs.version }}
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cargo/bin/circom
        key: circom-${{ inputs.version }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build circom ${{ inputs.version }} from iden3/circom
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --git https://github.com/iden3/circom.git --tag "v${{ inputs.version }}" circom

    - name: Put ~/.cargo/bin on PATH
      shell: bash
      run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

    - name: Check circom version
      shell: bash
      run: |
        v="$("$HOME/.cargo/bin/circom" --version)"
        echo "$v"
        echo "$v" | grep -Eq "(^|[^0-9.])${{ inputs.version }}($|[^0-9.])"
